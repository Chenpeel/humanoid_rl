[project]
name = "rl"
version = "0.1.0"
description = "JAX/MJX Reinforcement Learning Training Framework"
readme = "README.md"
requires-python = ">=3.11"

# ==================== 核心依赖 ====================
# CUDA 配置：需要系统安装 CUDA 12.x 驱动和库
dependencies = [
    # JAX 核心（CPU 版本）
    "jax==0.8.1",
    "jaxlib==0.8.1",

    # JAX CUDA 插件（GPU 加速）
    # 包含 CUDA 运行时库，无需系统安装 CUDA
    "jax-cuda12-plugin[with-cuda]==0.8.1",
    "jax-cuda12-pjrt==0.8.1",

    # CUDA 运行时库（通过 pip 安装，无需系统 CUDA）
    "nvidia-cuda-runtime-cu12>=12.1.0",
    "nvidia-cuda-nvcc-cu12>=12.1.0",
    "nvidia-cublas-cu12>=12.1.0",
    "nvidia-cufft-cu12>=11.0.0",
    "nvidia-cudnn-cu12>=8.9.0",

    # 物理仿真
    "mujoco>=3.0.0",
    "mujoco-mjx",

    # 深度学习
    "flax>=0.8.0",
    "optax>=0.1.7",
    "orbax-checkpoint>=0.11.31",

    # 工具库
    "rich>=13.0.0",
    "numpy>=2.0.0,<2.4.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "mediapy>=1.1.0",
    "urdf2mjcf>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
ksim = [
    "ksim>=0.2.0",
]
tensorboard = [
    "tensorboard>=2.12.0",  # 用于 TensorBoard 日志写入/可视化
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rl"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
rl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ==================== Black 代码格式化 ====================
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # 排除的目录
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.jax_cache
  | build
  | dist
  | logs
)/
'''

# ==================== isort 导入排序 ====================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
known_first_party = ["rl"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ==================== mypy 类型检查 ====================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "jax.*",
    "mujoco.*",
    "flax.*",
    "optax.*",
    "orbax.*",
]
ignore_missing_imports = true
