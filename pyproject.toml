[project]
name = "humanoid-rl"
version = "0.1.0"
description = "通用双足机器人强化学习训练框架"
requires-python = ">=3.10"
dependencies = [
    "isaacsim-rl>=4.0",
    "rsl-rl>=2.0",
    "torch>=2.0",
    "numpy>=1.24",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tensorboard>=2.14",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
train = "scripts.train:main"
play = "scripts.play:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "ipython>=8.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "ruff>=0.1",
]
