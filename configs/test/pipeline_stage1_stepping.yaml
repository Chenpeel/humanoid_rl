# ==================== 流水线快速测试 - 阶段1：踏步 ====================
# 目标：快速验证阶段1训练逻辑
# 用途：测试阶段切换、模型传递

# ==================== 场景配置 ====================
scene: flat_terrain
env_type: walking

# ==================== 环境配置 ====================
num_envs: 128
num_steps: 8
max_episode_steps: 100

# ==================== 任务参数（小幅踏步）====================
cmd_x_range: [0.0, 0.1]      # 小幅前向
cmd_y_range: [0.0, 0.0]
cmd_yaw_range: [0.0, 0.0]

# ==================== 奖励权重 ====================
reward_weights:
  forward_velocity: 0.3
  gait_symmetry: 0.5
  foot_clearance: 0.3
  trunk_height: 1.0
  orientation: -0.3
  trunk_lin_vel_z: -0.3
  drag: -0.3
  action_rate: -0.005
  torques: -0.00005
  alive: 0.5

# ==================== PPO超参数 ====================
num_epochs: 2
num_minibatches: 4
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 32768
log_interval: 1
eval_interval: 5
save_interval: 5

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [128, 128, 64]
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: false
video_interval: 0
video_frames: 0
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 1
  stage_name: "test_stepping"
  min_iterations: 10
  transition_criteria:
    min_gait_symmetry: 0.0   # 无条件切换
    min_foot_clearance: 0.0
