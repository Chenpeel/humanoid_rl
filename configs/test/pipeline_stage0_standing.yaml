# ==================== 流水线快速测试 - 阶段0：站立 ====================
# 目标：快速验证流水线训练逻辑（每阶段<1分钟）
# 用途：测试阶段切换、模型传递、配置加载
# 资源需求：4-6GB RAM + 2-4GB GPU

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking       # 行走任务

# ==================== 环境配置（极简资源）====================
num_envs: 128           # 极小环境数（快速测试）
num_steps: 8            # 极短rollout
max_episode_steps: 100  # 短episode

# ==================== 任务参数（站立）====================
cmd_x_range: [0.0, 0.0]      # 站立任务
cmd_y_range: [0.0, 0.0]
cmd_yaw_range: [0.0, 0.0]

# ==================== 奖励权重 ====================
reward_weights:
  forward_velocity: 0.0      # 站立任务
  gait_symmetry: 0.0
  foot_clearance: 0.0
  trunk_height: 1.2
  orientation: -0.8
  trunk_lin_vel_z: -0.5
  drag: -0.2
  action_rate: -0.005
  torques: -0.00005
  alive: 0.8

# ==================== PPO超参数 ====================
num_epochs: 2              # 减少epoch加快速度
num_minibatches: 4
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# ==================== 训练配置（极短训练）====================
total_timesteps: 32768     # 32K步（128×8×32次更新）
log_interval: 1
eval_interval: 5
save_interval: 5

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置（小型网络）====================
hidden_dims: [128, 128, 64]
shared_backbone: true

# ==================== 视频录制配置（禁用）====================
enable_video: false
video_interval: 0
video_frames: 0
video_camera: "track"

# ==================== 阶段切换配置（宽松条件，快速切换）====================
stage_config:
  stage_id: 0
  stage_name: "test_standing"
  min_iterations: 10       # 极少迭代即可切换
  transition_criteria:
    min_reward: 0.0        # 无条件切换（仅测试流程）
    max_fall_rate: 1.0
    min_height_stability: 0.0
