# ==================== 阶段0测试配置 ====================
# 目标：验证阶段0站立训练完整流程（~10分钟完成）
# 用途：验证训练逻辑、奖励函数、阶段切换
# 资源需求：8-10GB RAM + 6-8GB GPU

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking       # 行走任务

# ==================== 环境配置（中等资源）====================
num_envs: 512           # 减半环境数（vs 正式1024）
num_steps: 32           # 减半步长（vs 正式64）
max_episode_steps: 500  # 保持与正式训练一致

# ==================== 任务参数 ====================
cmd_x_range: [0.0, 0.0]      # 站立任务
cmd_y_range: [0.0, 0.0]
cmd_yaw_range: [0.0, 0.0]

# ==================== 奖励权重（与stage0完全一致）====================
reward_weights:
  forward_velocity: 0.0
  gait_symmetry: 0.0
  foot_clearance: 0.0
  trunk_height: 1.2
  orientation: -0.8
  trunk_lin_vel_z: -0.5
  drag: -0.2
  action_rate: -0.005
  torques: -0.00005
  alive: 0.8

# ==================== PPO超参数（与stage0一致）====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# ==================== 训练配置（约减少20倍训练步数）====================
total_timesteps: 8192000   # 约8M步（512×32×500次更新）
log_interval: 10
eval_interval: 50
save_interval: 20

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置（标准网络测试真实性能）====================
hidden_dims: [512, 512, 256]
shared_backbone: true

# ==================== 视频录制配置（禁用）====================
enable_video: false        # 测试时禁用视频
video_interval: 0
video_frames: 0
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 0
  stage_name: "test_stage0"
  min_iterations: 500      # 8M步/(512*32) = 500 iterations
  transition_criteria:
    min_reward: 0.6
    max_fall_rate: 0.05
    min_height_stability: 0.95
