# PPO训练配置文件
# 优先级：命令行参数 > YAML配置 > 代码默认值

# ==================== 场景配置 ====================
scene: flat_terrain # 训练场景 (flat_terrain / rough_terrain)

# ==================== 环境配置 ====================
num_envs: 8192 # 并行环境数
num_steps: 1024 # 每次rollout的步数
max_episode_steps: 1000 # 每个episode最大步数

# ==================== PPO超参数 ====================
num_epochs: 4 # 每次update的epoch数
num_minibatches: 4 # mini-batch数量
gamma: 0.99 # 折扣因子
gae_lambda: 0.95 # GAE lambda
clip_epsilon: 0.2 # PPO裁剪系数
clip_value: true # 是否裁剪价值函数
value_coef: 0.5 # 价值损失系数
entropy_coef: 0.01 # 熵正则化系数
max_grad_norm: 0.5 # 梯度裁剪阈值
value_clip_epsilon: 0.2 # 价值函数裁剪系数

# ==================== 训练配置 ====================
total_timesteps: 2000000000 # 总训练步数
log_interval: 100 # 日志记录间隔
eval_interval: 100 # 评估间隔

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4 # 峰值学习率
final_lr_fraction: 0.02 # 最终学习率相对峰值的比例

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256] # 隐藏层维度列表
activation: "swish" # 激活函数类型
use_layer_norm: false # 是否使用LayerNorm
shared_backbone: true # 是否使用共享backbone
