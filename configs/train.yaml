# ==================== 训练配置文件 ====================
# 优先级：命令行参数 > YAML配置 > 代码默认值

# ==================== 场景配置 ====================
scene: flat_terrain # 训练场景 (flat_terrain / rough_terrain)

# ==================== 环境配置 ====================
num_envs: 16384 # 并行环境数（RTX 4090 24GB 优化配置）
num_steps: 64 # 每次rollout的步数（降低以适应更多环境）
max_episode_steps: 2048 # 每个episode最大步数

# 批次大小 = 16384 × 64 = 1,048,576
# 显存占用预估：约 20-22GB（RTX 4090 24GB 安全范围）
# 编译时间预估：首次约 20-40 分钟

# ==================== PPO超参数 ====================
num_epochs: 4 # 每次update的epoch数
num_minibatches: 8 # mini-batch数量（从4增加到8，更细粒度更新）
gamma: 0.99 # 折扣因子
gae_lambda: 0.95 # GAE lambda
clip_epsilon: 0.2 # PPO裁剪系数
clip_value: true # 是否裁剪价值函数
value_coef: 0.5 # 价值损失系数
entropy_coef: 0.01 # 熵正则化系数
max_grad_norm: 0.5 # 梯度裁剪阈值
value_clip_epsilon: 0.2 # 价值函数裁剪系数

# ==================== 训练配置 ====================
total_timesteps: 104857600 # 总训练步数 (100轮次 × 16384环境 × 64步)
log_interval: 10 # 日志记录间隔
eval_interval: 50 # 评估间隔
save_interval: 100 # 模型保存间隔（每100次更新保存一次checkpoint）

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4 # 峰值学习率
final_lr_fraction: 0.02 # 最终学习率相对峰值的比例

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256] # 隐藏层维度列表
activation: "swish" # 激活函数类型
use_layer_norm: false # 是否使用LayerNorm
shared_backbone: true # 是否使用共享backbone

# ==================== 视频录制配置 ====================
enable_video: false # 默认关闭，训练时用 --enable-video 开启
video_interval: 200 # 每 200 updates 录制一次（约每 2-3 分钟）
video_frames: 180 # 每个视频 180 帧（3秒@60fps）
video_camera: "track" # 使用跟踪相机（可选：track, side, top）

