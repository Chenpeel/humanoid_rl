# ==================== 10小时快速训练：阶段3 (正常行走) ====================
# 目标：主要训练阶段
# 预算：约4.0小时 (800 iters)

scene: jiyuan_fit_flat
env_type: walking

num_envs: 1024
num_steps: 64
max_episode_steps: 2000
target_height: 0.78

cmd_x_range: [-0.2, 0.8]
cmd_y_range: [-0.3, 0.3]
cmd_yaw_range: [-0.5, 0.5]

reward_weights:
  forward_velocity: 1.2
  gait_symmetry: 0.5
  foot_clearance: 0.3
  trunk_height: 0.8
  orientation: -0.3
  trunk_lin_vel_z: -0.3
  drag: -0.6
  alive: 0.3
  action_rate: -0.002
  torques: -0.00003
  stability: 1.2

num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.005
max_grad_norm: 0.5

total_timesteps: 52428800  # 800 iters * 1024 * 64
log_interval: 10
eval_interval: 50
save_interval: 50

learning_rate: 3.0e-4
final_lr_fraction: 0.02

hidden_dims: [512, 512, 256]
shared_backbone: true

enable_video: true
video_interval: 100
video_frames: 180
video_camera: "track"

stage_config:
  stage_id: 3
  stage_name: "normal_walk_10h"
  min_iterations: 800
  transition_criteria:
    min_velocity_tracking: 0.7
    max_fall_rate: 0.1
