# ==================== 10小时快速训练 ====================
# 目标：10小时内完成基础行走训练
# 硬件：1080Ti 11GB + 32GB RAM
# 训练时间：约10小时 (1440 iterations)

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking

# ==================== 环境配置 ====================
num_envs: 1024           # 1080Ti 11GB限制
num_steps: 64
max_episode_steps: 1000
target_height: 0.78

# ==================== 任务参数（课程学习） ====================
# 速度命令范围：简化任务
cmd_x_range: [0.0, 0.2]       # 降低速度范围，更容易学习
cmd_y_range: [-0.05, 0.05]    # 减少侧向移动
cmd_yaw_range: [-0.2, 0.2]    # 减少转动幅度

# ==================== 奖励权重 ====================
reward_weights:
  # 基础运动奖励
  forward_velocity: 1.0       # 提高前向速度奖励
  gait_symmetry: 0.2          # 降低步态对称性
  foot_clearance: 0.1         # 降低脚部抬高
  trunk_height: 0.8           # 提高高度保持（鼓励站立）
  orientation: -0.3           # 加强姿态惩罚
  trunk_lin_vel_z: -0.5       # 加强Z方向速度惩罚（ discourage跳变）
  drag: -0.5                  # 加强拖地惩罚
  alive: 0.5                  # 提高存活奖励
  action_rate: -0.01          # 动作平滑
  torques: -0.0001            # 力矩惩罚
  stability: 1.5              # 提高稳定性奖励

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01            # 提高熵，增加探索
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 94371840     # 94.4M步 (1440 iterations, 约10小时)
log_interval: 20
eval_interval: 100
save_interval: 50

# ==================== 优化器配置 ====================
learning_rate: 5.0e-4         # 提高学习率，加快收敛
final_lr_fraction: 0.1        # 最终学习率为10%

# ==================== 网络配置 ====================
hidden_dims: [256, 256, 128]  # 减小网络，加快训练
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 200           # 降低频率
video_frames: 120
video_camera: "track"

# ==================== 阶段配置 ====================
stage_config:
  stage_id: 10
  stage_name: "quick_10h"
  min_iterations: 1440         # 10小时训练
  transition_criteria:
    min_mean_velocity: 0.1    # 降低要求，0.1 m/s即可
    max_fall_rate: 0.3        # 允许更高摔倒率
