# ==================== 10小时快速训练：阶段1 (原地踏步) ====================
# 目标：快速学会踏步
# 预算：约1.5小时 (300 iters)

scene: jiyuan_fit_flat
env_type: walking

num_envs: 1024
num_steps: 64
max_episode_steps: 500
target_height: 0.78

cmd_x_range: [0.1, 0.2]
cmd_y_range: [-0.05, 0.05]
cmd_yaw_range: [-0.1, 0.1]

reward_weights:
  forward_velocity: 1.0
  gait_symmetry: 0.5
  foot_clearance: 1.0
  trunk_height: 1.0
  orientation: -0.3
  trunk_lin_vel_z: -0.3
  drag: -0.3
  alive: 0.5
  action_rate: -0.0005
  torques: -0.00001
  stability: 0.4

num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

total_timesteps: 19660800  # 300 iters * 1024 * 64
log_interval: 10
eval_interval: 50
save_interval: 50

learning_rate: 3.0e-4
final_lr_fraction: 0.02

hidden_dims: [512, 512, 256]
shared_backbone: true

enable_video: true
video_interval: 100
video_frames: 180
video_camera: "track"

stage_config:
  stage_id: 1
  stage_name: "stepping_10h"
  min_iterations: 300
  transition_criteria:
    min_gait_symmetry: 0.4    # 稍微降低要求
    min_foot_clearance: 0.2
