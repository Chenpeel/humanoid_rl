# ==================== 10小时快速训练：阶段2 (小步行走) ====================
# 目标：快速学会移动
# 预算：约3.0小时 (600 iters)

scene: flat_terrain
env_type: walking

num_envs: 1024
num_steps: 64
max_episode_steps: 1000
target_height: 0.78

cmd_x_range: [0.0, 0.3]
cmd_y_range: [-0.1, 0.1]
cmd_yaw_range: [-0.3, 0.3]

reward_weights:
  forward_velocity: 0.8
  gait_symmetry: 0.3
  foot_clearance: 0.2
  trunk_height: 0.5
  orientation: -0.2
  trunk_lin_vel_z: -0.2
  drag: -0.3
  alive: 0.2
  action_rate: -0.001
  torques: -0.00002
  stability: 1.0

num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.005
max_grad_norm: 0.5

total_timesteps: 39321600  # 600 iters * 1024 * 64
log_interval: 10
eval_interval: 50
save_interval: 50

learning_rate: 3.0e-4
final_lr_fraction: 0.02

hidden_dims: [512, 512, 256]
shared_backbone: true

enable_video: true
video_interval: 100
video_frames: 180
video_camera: "track"

stage_config:
  stage_id: 2
  stage_name: "slow_walk_10h"
  min_iterations: 600
  transition_criteria:
    min_velocity_tracking: 0.6  # 稍微降低要求
    max_fall_rate: 0.15
