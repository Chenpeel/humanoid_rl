# ==================== 10小时长训练配置（自动课程学习）====================
# 使用自动三阶段课程学习：
#   阶段1 (0-50k steps): 站立平衡
#   阶段2 (50k-150k steps): 低速行走
#   阶段3 (150k+ steps): 全速行走
#
# 奖励权重和环境参数由课程学习模块自动管理，无需手动配置
# 本配置优化显存使用，适合长时间训练

# ==================== 场景配置 ====================
robot_name: gaoda_jiyuan
scene: jiyuan_scene
env_type: walking

# ==================== 环境配置 ====================
num_envs: 512 # 并行环境数（RTX 1080ti 11GB 优化）
num_steps: 64 # 每次rollout的步数
max_episode_steps: 2000 # episode最大步数

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# ==================== 课程学习配置 ====================
curriculum_file: configs/train-10h/curriculum.yaml

# ==================== 训练配置 ====================
total_timesteps: 50000000
log_interval: 10
eval_interval: 50
save_interval: 1000

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [256, 256, 256]
shared_backbone: true

# ==================== 视频录制 ====================
enable_video: false
video_interval: 1000
video_frames: 180
video_camera: "track"
