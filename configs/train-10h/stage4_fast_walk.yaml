# ==================== 10小时快速训练：阶段4 (高速适应) ====================
# 目标：冲击更高速度
# 预算：约1.0小时 (200 iters)

scene: jiyuan_fit_flat
env_type: walking

num_envs: 1024
num_steps: 64
max_episode_steps: 2000

cmd_x_range: [-0.5, 1.2]
cmd_y_range: [-0.5, 0.5]
cmd_yaw_range: [-1.0, 1.0]

reward_weights:
  forward_velocity: 1.8
  gait_symmetry: 0.4
  foot_clearance: 0.4
  trunk_height: 0.8
  orientation: -0.4
  trunk_lin_vel_z: -0.4
  drag: -0.8
  alive: 0.3
  action_rate: -0.01
  torques: -0.0001
  stability: 1.5

num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.005
max_grad_norm: 0.5

total_timesteps: 13107200  # 200 iters * 1024 * 64
log_interval: 10
eval_interval: 50
save_interval: 50

learning_rate: 3.0e-4
final_lr_fraction: 0.02

hidden_dims: [512, 512, 256]
shared_backbone: true

enable_video: true
video_interval: 50
video_frames: 180
video_camera: "track"

stage_config:
  stage_id: 4
  stage_name: "fast_walk_10h"
  min_iterations: 200
  transition_criteria:
    min_velocity_tracking: 0.65
    max_fall_rate: 0.15
