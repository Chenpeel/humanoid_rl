# ==================== 快速测试配置（自动课程学习）====================
# 用于快速验证代码正确性，不追求训练效果
# 小批次、少步数，适合调试

# ==================== 场景配置 ====================
robot_name: gaoda_jiyuan
scene: jiyuan_scene
# robot_name: unitree_h1
# scene: h1_scene
env_type: walking

# ==================== 自定义课程学习配置 ====================
# 指定课程配置文件路径（可以是简单的权重字典，也可以是多阶段配置）
curriculum_file: configs/quick_test/curriculum.yaml

# 自定义环境配置（覆盖默认课程学习设置）
env_config:
  # 零速度命令（站立不动）
  cmd_x_range: [0.0, 0.0]
  cmd_y_range: [0.0, 0.0]
  cmd_yaw_range: [0.0, 0.0]
  # Episode长度（避免单条轨迹过长导致学习信号稀释）
  max_steps: 500
  # 目标高度稍高（匹配初始化高度）
  target_height: 0.92

# ==================== 环境配置（快速测试优化）====================
num_envs: 256 # 1080 Ti 11GB 友好；过大可能OOM
num_steps: 64 # Rollout步数（保证GAE估计质量）
max_episode_steps: 500 # (备注) 当前代码不直接读取该字段；若需要请放到 env_config.max_steps

# ==================== PPO超参数 ====================
num_epochs: 2
num_minibatches: 4
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.3
value_coef: 1.0
entropy_coef: 0.02
max_grad_norm: 0.5

# ==================== 训练配置（快速测试）====================

total_timesteps: 8000000
log_interval: 10
eval_interval: 50
save_interval: 100

# ==================== 优化器配置 ====================
learning_rate: 5.0e-4
final_lr_fraction: 0.1 # 从 0.02 提高到 0.1，防止过早衰减（关键修复）

# ==================== 网络配置（小网络）====================
# 3-5 小时训练：用更大的网络，避免容量不足
hidden_dims: [512, 512, 256]
shared_backbone: true

# ==================== 视频录制 ====================
enable_video: false
video_interval: 100
video_frames: 60
video_camera: "track"
