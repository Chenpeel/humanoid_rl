# ==================== 快速测试配置（自动课程学习）====================
# 用于快速验证代码正确性，不追求训练效果
# 小批次、少步数，适合调试

# ==================== 场景配置 ====================
robot_name: gaoda_jiyuan
scene: jiyuan_scene
# robot_name: unitree_h1
# scene: h1_scene
env_type: walking

# ==================== 自定义课程学习配置 ====================
# 指定课程配置文件路径（可以是简单的权重字典，也可以是多阶段配置）
curriculum_file: configs/quick_test/curriculum.yaml

# 自定义环境配置（覆盖默认课程学习设置）
env_config:
  # 零速度命令（站立不动）
  cmd_x_range: [0.0, 0.0]
  cmd_y_range: [0.0, 0.0]
  cmd_yaw_range: [0.0, 0.0]
  # 目标高度稍高（匹配初始化高度）
  target_height: 0.92

# ==================== 环境配置（快速测试优化）====================
num_envs: 256 # 快速测试环境数（平衡速度和样本多样性）
num_steps: 64 # Rollout步数（保证GAE估计质量）
max_episode_steps: 500 # Episode长度（给机器人足够时间学习）

# ==================== PPO超参数 ====================
num_epochs: 2
num_minibatches: 4
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.3
value_coef: 1.0
entropy_coef: 0.02
max_grad_norm: 0.5

# ==================== 训练配置（快速测试）====================
total_timesteps: 2000000 # 2M steps（约 1 小时，足够完成三阶段训练）
log_interval: 5
eval_interval: 10
save_interval: 50

# ==================== 优化器配置 ====================
learning_rate: 5.0e-4
final_lr_fraction: 0.1 # 从 0.02 提高到 0.1，防止过早衰减（关键修复）

# ==================== 网络配置（小网络）====================
hidden_dims: [256, 256]
shared_backbone: true

# ==================== 视频录制 ====================
enable_video: false
video_interval: 100
video_frames: 60
video_camera: "track"
