# ==================== 极速测试 - 阶段0：站立（无需重复编译）====================
# 核心策略：固定网络结构、固定环境数、固定batch参数，确保编译缓存复用
# 目标：首次编译后，后续阶段直接使用缓存，<30秒完成3阶段测试

# ==================== 场景配置 ====================
scene: flat_terrain
env_type: walking

# ==================== 环境配置（最小化，快速编译）====================
num_envs: 32             # 极小环境数（降低编译复杂度）
num_steps: 4             # 极短rollout
max_episode_steps: 50    # 极短episode

# ==================== 任务参数（站立）====================
cmd_x_range: [0.0, 0.0]
cmd_y_range: [0.0, 0.0]
cmd_yaw_range: [0.0, 0.0]

# ==================== 奖励权重 ====================
reward_weights:
  forward_velocity: 0.0      # 站立任务
  gait_symmetry: 0.0
  foot_clearance: 0.0
  trunk_height: 1.2
  orientation: -0.8
  trunk_lin_vel_z: -0.5
  drag: -0.2
  action_rate: -0.005
  torques: -0.00005
  alive: 0.8

# ==================== PPO超参数（固定，避免重复编译）====================
num_epochs: 1              # 最小epoch（固定）
num_minibatches: 2         # 固定minibatch数
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# ==================== 训练配置（极短）====================
total_timesteps: 2048      # 32×4×16 = 2048步（16次更新）
log_interval: 1
eval_interval: 10
save_interval: 10

# ==================== 优化器配置（固定）====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置（极小网络，快速编译）====================
hidden_dims: [32, 32]    # 极小网络（2层，快速编译）
shared_backbone: true

# ==================== 视频录制配置（禁用）====================
enable_video: false
video_interval: 0
video_frames: 0
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 0
  stage_name: "quick_standing"
  min_iterations: 16       # 16次更新即切换
  transition_criteria:
    min_reward: 0.0        # 无条件切换
    max_fall_rate: 1.0
