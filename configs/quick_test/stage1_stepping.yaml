# ==================== 极速测试 - 阶段1：踏步（复用编译缓存）====================
# 关键：与stage0完全相同的网络结构和环境参数，仅修改任务目标和奖励权重

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat
env_type: walking

# ==================== 环境配置（与stage0完全相同）====================
num_envs: 32             # 固定
num_steps: 4             # 固定
max_episode_steps: 50    # 固定

# ==================== 任务参数（小幅踏步）====================
cmd_x_range: [0.0, 0.05]    # 极小前向速度
cmd_y_range: [0.0, 0.0]
cmd_yaw_range: [0.0, 0.0]

# ==================== 奖励权重 ====================
reward_weights:
  forward_velocity: 0.3
  gait_symmetry: 0.5
  foot_clearance: 0.3
  trunk_height: 1.0
  orientation: -0.3
  trunk_lin_vel_z: -0.3
  drag: -0.3
  action_rate: -0.005
  torques: -0.00005
  alive: 0.5

# ==================== PPO超参数（与stage0完全相同）====================
num_epochs: 1
num_minibatches: 2
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 2048      # 16次更新
log_interval: 1
eval_interval: 10
save_interval: 10

# ==================== 优化器配置（与stage0完全相同）====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置（与stage0完全相同）====================
hidden_dims: [32, 32]  # 完全相同，复用编译缓存
shared_backbone: true

# ==================== 视频录制配置（禁用）====================
enable_video: false
video_interval: 0
video_frames: 0
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 1
  stage_name: "quick_stepping"
  min_iterations: 16
  transition_criteria:
    min_gait_symmetry: 0.0
    min_foot_clearance: 0.0
