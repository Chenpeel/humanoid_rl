# gaoda_jiyuan：站立专训（ksim）

# ==================== MJCF ====================
xml_path: robots/gaoda_jiyuan/scene.xml

# ==================== Engine ====================
dt: 0.002
ctrl_dt: 0.02
iterations: 8
ls_iterations: 8
solver: newton
integrator: implicitfast

# ==================== PPO / Train ====================
run_mode: train
num_envs: 512
batch_size: 128
# rollout_length_seconds 在 ksim 内部会按 seconds/dt 转成帧数（这里 dt=0.002 会导致 2s=1000 帧≈20s rollout）
# 站立任务建议直接用 rollout_length_frames（单位：ctrl step；这里 ctrl_dt=0.02，100 帧≈2s）
rollout_length_frames: 100
num_passes: 2

learning_rate: 3.0e-4
grad_clip: 1.0

gamma: 0.99
lam: 0.95
clip_param: 0.2
value_loss_coef: 0.5
entropy_coef: 0.01
kl_coef: 1.0e-3
normalize_advantages: true

# ==================== 训练控制 ====================
# 站立训练不建议用超长 warmup（会导致一夜几乎学不动）；默认用常数学习率即可
max_steps: null # 最大训练步数（null 表示无限训练）
warmup_steps: 0 # 学习率预热步数（max_steps=null 时无效）
valid_every_n_seconds: 600.0 # 降低完整 valid（渲染+作图）频率，提升有效训练吞吐

# ==================== Threading (optional) ====================
# cpu_threads: 4 # 限制 CPU 线程/核心数（会同步设置 OMP/MKL/OPENBLAS/NUMEXPR + XLA CPU 线程）
# xla_cpu_thread_count: 4 # 仅在 JAX 支持该 flag 时设置（旧版会报 Unknown flag）
# xla_cpu_multi_thread_eigen: true # 可选：显式控制 XLA CPU 多线程
# omp_num_threads: 4
# mkl_num_threads: 4
# openblas_num_threads: 4
# numexpr_num_threads: 4

# ==================== Commands (world frame) ====================
# (vx, vy, wz) 全部置 0：纯站立
cmd_x_range: [0.0, 0.0]
cmd_y_range: [0.0, 0.0]
cmd_yaw_range: [0.0, 0.0]
cmd_switch_prob: 0.0
cmd_zero_prob: 0.0

# ==================== Posture ====================
target_height: 0.985

# ==================== Reset randomization ====================
reset_joint_pos_scale: 0.05
reset_joint_vel_scale: 0.15
reset_pitch_range: [-0.15, 0.15]
reset_roll_range: [-0.15, 0.15]
# 增加 yaw 方向扰动
# reset_yaw_range: [-3.14, 3.14]
# 增加 随机扰动： 随机推力、随机摩擦/质量抖动、噪声/延迟

# ==================== Termination ====================
terminate_min_z: 0.65
terminate_max_z: 1.50
terminate_max_tilt_radians: 1.0

# ==================== Reward weights ====================
w_alive: 100.0
# StayAliveReward: per-step=1/balance, done-fail=-1；适度降低 balance 让早期 episode 更“可活”
alive_balance: 95.0
w_upright: 5.0
w_height: 2.0
w_vel_track: 1.0
w_action_rate: -0.02
w_torque: -0.002
w_ankle_deviation: -0.01
w_foot_flat: 2.0

# ==================== Reward kernels ====================
upright_kernel_scale: 0.25
height_kernel_scale: 0.20
vel_kernel_scale: 0.25
yaw_kernel_scale: 0.25

# ==================== Network ====================
hidden_sizes: [512, 512, 512]
init_log_std: -0.5
