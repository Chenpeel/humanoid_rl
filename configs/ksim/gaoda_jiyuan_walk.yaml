# gaoda_jiyuan：直立行走（ksim）

# ==================== MJCF ====================
xml_path: robots/gaoda_jiyuan/scene.xml

# ==================== Engine ====================
dt: 0.002
ctrl_dt: 0.02
iterations: 8
ls_iterations: 8
solver: newton
integrator: implicitfast

# ==================== PPO / Train ====================
run_mode: train
num_envs: 512
batch_size: 128
rollout_length_seconds: 2.0
num_passes: 2

learning_rate: 3.0e-4
grad_clip: 1.0

gamma: 0.99
lam: 0.95
clip_param: 0.2
value_loss_coef: 0.5
entropy_coef: 0.01
kl_coef: 1.0e-3
normalize_advantages: true

# ==================== Commands (world frame) ====================
# 世界系速度命令 (vx, vy, wz)
# - 先别上太高速度；等能稳定走后再逐步提高
cmd_x_range: [0.1, 0.3]
cmd_y_range: [-0.05, 0.05]
cmd_yaw_range: [-0.2, 0.2]
cmd_switch_prob: 0.02
cmd_zero_prob: 0.1

# ==================== Posture ====================
target_height: 0.92

# ==================== Reset randomization ====================
reset_joint_pos_scale: 0.05
reset_joint_vel_scale: 0.5
reset_pitch_range: [-0.15, 0.15]
reset_roll_range: [-0.15, 0.15]

# ==================== Termination ====================
terminate_min_z: 0.65
terminate_max_z: 1.50
terminate_max_tilt_radians: 1.0

# ==================== Reward weights ====================
w_alive: 100.0
w_upright: 2.0
w_height: 1.5
w_vel_track: 2.0
w_action_rate: 0.01
w_torque: 0.001

# ==================== Reward kernels ====================
upright_kernel_scale: 0.25
height_kernel_scale: 0.20
vel_kernel_scale: 0.25
yaw_kernel_scale: 0.25

# ==================== Network ====================
hidden_sizes: [512, 512, 256]
init_log_std: -0.5
