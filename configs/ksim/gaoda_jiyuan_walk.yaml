# gaoda_jiyuan：直立行走（ksim）

# ==================== MJCF ====================
xml_path: robots/gaoda_jiyuan/scene.xml

# ==================== Engine ====================
dt: 0.002
ctrl_dt: 0.02
iterations: 8
ls_iterations: 8
solver: newton
integrator: implicitfast

# ==================== PPO / Train ====================
run_mode: train
num_envs: 512
batch_size: 128
# rollout_length_seconds 在 ksim 内部会按 seconds/dt 转成帧数（这里 dt=0.002 会导致 2s=1000 帧≈20s rollout）
# 建议直接用 rollout_length_frames（单位：ctrl step；这里 ctrl_dt=0.02，100 帧≈2s）
rollout_length_frames: 100
num_passes: 2

learning_rate: 3.0e-4
grad_clip: 1.0

gamma: 0.99
lam: 0.95
clip_param: 0.2
value_loss_coef: 0.5
entropy_coef: 0.01
kl_coef: 1.0e-3
normalize_advantages: true

# ==================== 训练控制 ====================
# 这里的 max_steps 默认是“每次 Rollout+Update 计 1 step”，不是 env step；避免填超大导致训练几乎跑不完
max_steps: 4000 # 约 4000 * (num_envs * rollout_length_frames) ≈ 2e8 samples
warmup_steps: 200 # 小 warmup 即可；过大会导致前期学习率过低
valid_every_n_seconds: 600.0 # 降低完整 valid（渲染+作图）频率，提升有效训练吞吐

# ==================== Threading (optional) ====================
cpu_threads: 4 # 限制 CPU 线程/核心数（会同步设置 OMP/MKL/OPENBLAS/NUMEXPR + XLA CPU 线程）
# xla_cpu_thread_count: 4 # 仅在 JAX 支持该 flag 时设置（旧版会报 Unknown flag）
# xla_cpu_multi_thread_eigen: true # 可选：显式控制 XLA CPU 多线程
omp_num_threads: 4
mkl_num_threads: 4
openblas_num_threads: 4
numexpr_num_threads: 4

# ==================== Commands (world frame) ====================
# 世界系速度命令 (vx, vy, wz)
# - 先别上太高速度；等能稳定走后再逐步提高
cmd_x_range: [0.1, 0.3]
cmd_y_range: [-0.05, 0.05]
cmd_yaw_range: [-0.2, 0.2]
cmd_switch_prob: 0.02
cmd_zero_prob: 0.1

# ==================== Posture ====================
target_height: 0.985

# ==================== Reset randomization ====================
reset_joint_pos_scale: 0.05
reset_joint_vel_scale: 0.15
reset_pitch_range: [-0.15, 0.15]
reset_roll_range: [-0.15, 0.15]

# ==================== Termination ====================
terminate_min_z: 0.65
terminate_max_z: 1.50
terminate_max_tilt_radians: 1.0

# ==================== Reward weights ====================
w_alive: 100.0
# StayAliveReward: per-step=1/balance, done-fail=-1；适度降低 balance 让早期 episode 更“可活”
alive_balance: 95.0
w_upright: 2.0
w_height: 1.5
w_vel_track: 2.0
w_action_rate: -0.01
w_torque: -0.001
w_ankle_deviation: -0.01
w_foot_flat: 0.2

# ==================== Reward kernels ====================
upright_kernel_scale: 0.25
height_kernel_scale: 0.20
vel_kernel_scale: 0.25
yaw_kernel_scale: 0.25

# ==================== Network ====================
hidden_sizes: [512, 512, 512]
init_log_std: -0.5
