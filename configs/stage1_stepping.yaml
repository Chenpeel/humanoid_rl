# ==================== 阶段1：原地踏步 ====================
# 目标：在保持平衡的基础上，开始有节奏的踏步动作
# 训练步数：209M-524M (200-500 iterations)
# 切换条件：步态对称性奖励 > 0.5，高度保持稳定

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking

# ==================== 环境配置 ====================
num_envs: 2048
num_steps: 32
max_episode_steps: 500

# ==================== 任务参数（课程学习） ====================
# 速度命令范围：微小移动
cmd_x_range: [0.0, 0.0]        # 前向速度仍为0
cmd_y_range: [-0.05, 0.05]     # 微小侧向移动
cmd_yaw_range: [-0.1, 0.1]     # 微小转动

# ==================== 奖励权重（踏步优化） ====================
reward_weights:
  forward_velocity: 0.0        # 不要求前进
  gait_symmetry: 0.5           # 开启步态对称性（重点）
  foot_clearance: 0.3          # 开启脚部抬高（重点）
  trunk_height: 1.0            # 高度保持奖励（降低避免过拟合）
  orientation: -0.5            # 姿态惩罚（降低避免负奖励爆炸）
  trunk_lin_vel_z: -0.5        # Z方向速度惩罚（降低）
  drag: -0.5                   # 开启拖地惩罚
  alive: 1.0
  action_rate: -0.015
  torques: -0.00015

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01            # 保持熵以探索步态
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 39321600    # 37.5M步 (减半，约37 iterations)
log_interval: 10
eval_interval: 25
save_interval: 25

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [256, 256, 128]
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 25
video_frames: 180
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 1
  stage_name: "stepping"
  min_iterations: 15       # 进一步减小最小迭代次数（快速测试）
  transition_criteria:
    min_gait_symmetry: 0.5    # 步态对称性奖励 > 0.5
    min_foot_clearance: 0.3   # 脚部抬高奖励 > 0.3
    min_height_stability: 0.9  # 高度稳定性 > 90%
