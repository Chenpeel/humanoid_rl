# 摔倒恢复环境配置
# 环境配置
env:
    name: "FallToStandEnv"
    model_path: "assets/xmls/mirrored.xml" # MuJoCo模型文件路径
    max_steps: 3000 # 更长的最大步数以允许恢复过程
    dt: 0.02 # 时间步长 (50Hz)
    control_mode: "torque" # 控制模式: torque, position, velocity
    use_gravity: true
    enable_contact: true

    # 初始状态配置
    initialization:
        # 初始姿态范围
        initial_pose:
            height_range: [0.05, 0.2] # 初始高度范围 (m)
            pitch_range: [-1.0, 1.0] # 初始俯仰角范围 (rad)
            roll_range: [-1.0, 1.0] # 初始横滚角范围 (rad)
            yaw_range: [-0.5, 0.5] # 初始偏航角范围 (rad)

        # 初始速度范围
        initial_velocity:
            linear_range: [-0.5, 0.5] # 线速度范围 (m/s)
            angular_range: [-1.0, 1.0] # 角速度范围 (rad/s)

    # 观察空间配置
    observation:
        include_qpos: true # 关节位置
        include_qvel: true # 关节速度
        include_imu: true # IMU数据
        include_contact: true # 接触传感器
        include_time: true # 时间信息
        include_com: true # 质心位置
        include_cop: true # 压力中心
        include_phase: true # 恢复阶段信息

    # 动作空间配置
    action:
        low: -1.0
        high: 1.0
        scale: 1.0 # 动作缩放因子

    # 恢复阶段配置
    recovery_phases:
        # 阶段1: 翻身阶段
        phase1_rollover:
            name: "rollover"
            target_contact_points: 2 # 目标接触点数量
            max_duration: 500 # 最大持续时间 (步数)
            success_threshold: 0.7 # 成功阈值

        # 阶段2: 支撑阶段
        phase2_support:
            name: "support"
            target_contact_points: 4 # 目标接触点数量
            max_duration: 1000
            success_threshold: 0.8

        # 阶段3: 定姿阶段
        phase3_stabilize:
            name: "stabilize"
            target_height: 0.3 # 目标高度 (m)
            max_duration: 1500
            success_threshold: 0.9

    # 奖励配置
    reward:
        weights:
            phase_progress: 2.0 # 阶段进度奖励
            posture_improvement: 1.0 # 姿态改善奖励
            contact_quality: 0.8 # 接触质量奖励
            energy_efficiency: 0.02 # 能量效率惩罚
            action_smoothness: 0.05 # 动作平滑惩罚
            time_penalty: 0.001 # 时间惩罚

        # 阶段进度奖励配置
        phase_progress:
            phase1_weight: 0.3 # 翻身阶段权重
            phase2_weight: 0.4 # 支撑阶段权重
            phase3_weight: 0.3 # 定姿阶段权重
            completion_bonus: 10.0 # 阶段完成奖励

        # 姿态改善奖励配置
        posture_improvement:
            height_weight: 0.4 # 高度改善权重
            pitch_weight: 0.3 # 俯仰改善权重
            roll_weight: 0.3 # 横滚改善权重
            improvement_threshold: 0.01 # 改善阈值

        # 接触质量奖励配置
        contact_quality:
            contact_points_weight: 0.6 # 接触点数量权重
            contact_stability_weight: 0.4 # 接触稳定性权重
            min_contact_points: 2 # 最小接触点数量

        # 能量效率配置
        energy_efficiency:
            penalty_weight: 0.02
            torque_weight: 0.6
            velocity_weight: 0.4

        # 动作平滑配置
        action_smoothness:
            penalty_weight: 0.05

# 模型配置
model:
    # 策略网络配置
    policy:
        hidden_sizes: [512, 256, 128] # 更大的网络以处理复杂恢复任务
        activation: "relu"
        output_activation: "tanh"
        use_batch_norm: true
        use_dropout: true # 使用dropout防止过拟合
        dropout_rate: 0.2

    # 价值网络配置
    value:
        hidden_sizes: [512, 256, 128]
        activation: "relu"
        use_batch_norm: true
        use_dropout: true
        dropout_rate: 0.1

    # 共享网络配置
    shared:
        use_shared_backbone: false # 不使用共享主干，任务太复杂
        shared_hidden_sizes: []

# PPO算法配置
algorithm:
    name: "PPO"

    # 超参数
    hyperparameters:
        learning_rate: 5e-4 # 较高的学习率以快速学习
        clip_ratio: 0.3 # 较大的裁剪比例
        gamma: 0.99
        lam: 0.95
        entropy_coef: 0.02 # 较高的熵系数以鼓励探索
        value_coef: 0.5

    # 训练配置
    training:
        num_epochs: 20 # 更多的训练轮数
        batch_size: 256 # 较大的批次大小
        minibatch_size: 128
        horizon: 4096 # 较长的时间步数

    # 优化器配置
    optimizer:
        name: "Adam"
        beta1: 0.9
        beta2: 0.999
        epsilon: 1e-7
        weight_decay: 0.0

# 训练配置
training:
    total_timesteps: 3000000 # 大量的训练步数
    num_envs: 32 # 大量的并行环境
    save_freq: 50000
    eval_freq: 25000
    log_freq: 100

    # 检查点配置
    checkpoint:
        save_dir: "./checkpoints/fall_to_stand"
        keep_last: 15
        save_best: true

    # 早停配置
    early_stopping:
        enabled: true
        patience: 30 # 很大的耐心值
        min_delta: 0.01

    # 学习率调度
    lr_scheduler:
        enabled: true
        scheduler_type: "exponential" # 使用指数衰减
        start_lr: 5e-4
        end_lr: 1e-6
        decay_rate: 0.999
        warmup_steps: 50000

    # 课程学习配置
    curriculum:
        enabled: true
        difficulty_levels: 5 # 难度等级数量

        # 难度级别配置
        levels:
            - level: 1
              initial_pose_range: "easy" # 容易的初始姿态
              success_threshold: 0.6
              max_steps: 2000

            - level: 2
              initial_pose_range: "medium"
              success_threshold: 0.7
              max_steps: 2500

            - level: 3
              initial_pose_range: "hard"
              success_threshold: 0.8
              max_steps: 3000

            - level: 4
              initial_pose_range: "very_hard"
              success_threshold: 0.85
              max_steps: 3500

            - level: 5
              initial_pose_range: "extreme"
              success_threshold: 0.9
              max_steps: 4000

        # 升级条件
        promotion:
            success_rate_threshold: 0.7 # 成功率阈值
            min_episodes: 100 # 最小评估回合数
            evaluation_frequency: 50000 # 评估频率 (步数)

# 评估配置
evaluation:
    num_episodes: 50 # 大量的评估回合
    render: false
    save_video: true # 保存恢复过程视频
    video_fps: 30

    # 评估指标
    metrics:
        - "episode_return"
        - "episode_length"
        - "success_rate" # 成功率
        - "recovery_time" # 恢复时间
        - "phase_completion_rate" # 阶段完成率
        - "energy_consumption" # 能量消耗
        - "final_stability" # 最终稳定性

    # 测试场景
    test_scenarios:
        - name: "back_fall"
          initial_pose:
              height: 0.1
              pitch: -0.8 # 向后摔倒
              roll: 0.0
              yaw: 0.0

        - name: "front_fall"
          initial_pose:
              height: 0.1
              pitch: 0.8 # 向前摔倒
              roll: 0.0
              yaw: 0.0

        - name: "side_fall_left"
          initial_pose:
              height: 0.1
              pitch: 0.0
              roll: -0.8 # 向左摔倒
              yaw: 0.0

        - name: "side_fall_right"
          initial_pose:
              height: 0.1
              pitch: 0.0
              roll: 0.8 # 向右摔倒
              yaw: 0.0

        - name: "complex_fall"
          initial_pose:
              height: 0.05
              pitch: 0.5
              roll: 0.5
              yaw: 0.3

# 日志配置
logging:
    log_dir: "./logs/fall_to_stand"
    use_tensorboard: true
    use_wandb: false

    # TensorBoard配置
    tensorboard:
        update_freq: 100

    # 控制台日志
    console:
        level: "INFO"
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

    # 详细日志
    detailed_logs:
        log_observations: false
        log_actions: false
        log_rewards: true
        log_phases: true # 记录阶段信息
        log_contact_info: true # 记录接触信息

# 硬件配置
hardware:
    device: "auto"
    num_threads: 16 # 大量的CPU线程
    gpu_memory_fraction: 0.95 # 更高的GPU内存使用

    # 性能优化
    performance:
        use_xla: true
        use_mixed_precision: true # 使用混合精度以节省内存
        tf_function: true

# 随机种子
seed: 42

# 可视化配置
visualization:
    enable_render: false # 是否启用3D渲染
    render_freq: 10 # 每N个epoch渲染一次
    render_interval: 10 # 每N步渲染一帧（帧采样）
    record_video: false # 是否录制视频
    video_dir: "videos" # 视频保存目录
    video_fps: 30 # 视频帧率

# 调试配置
debug:
    verbose: false
    print_obs: false
    print_reward: false
    print_action: false
    save_trajectories: true # 保存恢复轨迹

    # 阶段调试
    phase_debug:
        print_phase_transitions: true # 打印阶段转换
        log_phase_rewards: true # 记录阶段奖励
        visualize_contact_points: true # 可视化接触点

    # 可视化调试
    visualization:
        plot_phase_progress: true # 绘制阶段进度
        plot_posture_evolution: true # 绘制姿态演化
        plot_contact_pattern: true # 绘制接触模式
        plot_energy_usage: true # 绘制能量使用
