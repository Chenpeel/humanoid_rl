# ==================== 阶段2：小步行走 ====================
# 目标：缓慢向前移动，建立速度跟踪意识
# 训练步数：524M-1.05B (500-1000 iterations)
# 切换条件：速度跟踪准确率 > 70%

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking

# ==================== 环境配置 ====================
num_envs: 2048
num_steps: 32
max_episode_steps: 1000  # 增加episode长度

# ==================== 任务参数（课程学习） ====================
# 速度命令范围：小速前进
cmd_x_range: [0.0, 0.3]       # 小速前进
cmd_y_range: [-0.1, 0.1]      # 侧向移动
cmd_yaw_range: [-0.3, 0.3]    # 小幅转动

# ==================== 奖励权重（小步行走优化） ====================
# 基础奖励权重（降低惩罚强度）
reward_weights:
  # 基础运动奖励（降低强度避免负奖励爆炸）
  forward_velocity: 0.8       # 降低前向速度奖励强度
  gait_symmetry: 0.3          # 降低步态对称性奖励
  foot_clearance: 0.2         # 降低脚部抬高奖励
  trunk_height: 0.5           # 大幅降低高度保持奖励
  orientation: -0.2           # 降低姿态惩罚强度
  trunk_lin_vel_z: -0.2       # 降低Z方向速度惩罚
  drag: -0.3                  # 大幅降低拖地惩罚
  alive: 0.2                  # 降低存活奖励
  action_rate: -0.005         # 降低动作变化率惩罚
  torques: -0.00005           # 降低力矩惩罚

  # Unitree增强奖励项（重点强化速度跟踪和步态周期性）
  gait_periodicity: 1.5       # 步态周期性（重点，慢速行走需要稳定节奏）
  swing_trajectory: 0.8       # 摆动轨迹（适中，建立基础摆动模式）
  landing_impact: -0.5        # 着地冲击（适度惩罚，培养轻柔着地）
  energy_efficiency: 0.6      # 能量效率（鼓励节能步态）
  velocity_tracking: 2.0      # 增强速度跟踪（重点，建立速度跟踪意识）
  stability: 1.0              # 综合稳定性（基础稳定性要求）

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.005           # 降低熵，开始利用
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 65536000    # 62.5M步 (减半，约62 iterations)
log_interval: 10
eval_interval: 25
save_interval: 25

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256]
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 25
video_frames: 180
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 2
  stage_name: "slow_walk"
  min_iterations: 15       # 进一步减小最小迭代次数（快速测试）
  transition_criteria:
    min_velocity_tracking: 0.7  # 速度跟踪准确率 > 70%
    min_mean_velocity: 0.15     # 平均前向速度 > 0.15 m/s
    max_fall_rate: 0.1          # 摔倒率 < 10%
