# ==================== 标准训练配置（自动课程学习）====================
# 使用自动三阶段课程学习：
#   阶段1 (0-50k steps): 站立平衡
#   阶段2 (50k-150k steps): 低速行走
#   阶段3 (150k+ steps): 全速行走
#
# 奖励权重和环境参数由课程学习模块自动管理，无需手动配置

# ==================== 场景配置 ====================
scene: flat_terrain
env_type: walking

# ==================== 环境配置 ====================
num_envs: 2048          # 并行环境数（适用于 RTX 3090/4080 16GB）
num_steps: 64           # 每次rollout的步数
max_episode_steps: 2000 # episode最大步数

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.3       # 从 0.2 提高到 0.3，允许策略更大幅度更新（解决停滞）
value_coef: 1.0         # 从 0.5 提高到 1.0，加速 Value 网络校准到 -200 范围
entropy_coef: 0.02      # 从 0.01 提高到 0.02，强制策略保持探索性（防止过早收敛）
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 500000000  # 500M steps（确保收敛）
log_interval: 10
eval_interval: 25
save_interval: 500

# ==================== 优化器配置 ====================
learning_rate: 5.0e-4       # 提高学习率，加速初期学习（你已调整）
final_lr_fraction: 0.1      # 从 0.01 提高到 0.1，防止过早衰减到极小值

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256]
shared_backbone: true

# ==================== 视频录制 ====================
enable_video: false
video_interval: 500
video_frames: 180
video_camera: "track"
