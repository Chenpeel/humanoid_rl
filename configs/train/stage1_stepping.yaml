# ==================== 阶段1：原地踏步 ====================
# 目标：在保持平衡的基础上，开始有节奏的踏步动作
# 训练步数：15M-45M (15-45 iterations)
# 切换条件：步态对称性奖励 > 0.5，高度保持稳定

# ==================== 场景配置 ====================
scene: flat_terrain  # 平坦地形
env_type: walking

# ==================== 环境配置 ====================
num_envs: 1024           # 1080Ti 11GB限制，从2048减半
num_steps: 64           # 翻倍增加时序信息
max_episode_steps: 500

# ==================== 任务参数（课程学习） ====================
# 速度命令范围：微小移动
cmd_x_range: [0.0, 0.0]        # 前向速度仍为0
cmd_y_range: [-0.05, 0.05]     # 微小侧向移动
cmd_yaw_range: [-0.1, 0.1]     # 微小转动

# ==================== 奖励权重（踏步优化） ====================
reward_weights:
  # 基础踏步奖励
  forward_velocity: 0.0        # 不要求前进
  gait_symmetry: 0.5           # 步态对称性（核心）
  foot_clearance: 0.3          # 脚部抬高（重点）
  trunk_height: 1.0            # 高度保持
  orientation: -0.3            # 姿态惩罚（降低强度）
  trunk_lin_vel_z: -0.3        # Z方向速度惩罚（降低）
  drag: -0.3                   # 拖地惩罚（降低）
  alive: 0.5                   # 存活奖励（降低）
  action_rate: -0.005          # 动作平滑（大幅降低）
  torques: -0.00005            # 扭矩惩罚（降低）

  # 增强奖励项（基于Unitree踏步研究，需要额外参数支持）
  # 注意：这些奖励项需要环境提供对应的数据（phase, joint_velocities等）
  # gait_periodicity: 0.6        # 步态周期性（踏步核心，需要phase参数）
  # swing_trajectory: 0.4        # 摆动轨迹（平滑抬脚，需要phase参数）
  # landing_impact: 0.2          # 着地冲击控制（需要landing_events和contact_forces）
  # energy_efficiency: 0.1       # 能量效率（需要joint_velocities参数）
  stability: 0.4               # 综合稳定性（高度+姿态+角速度）

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01            # 保持熵以探索步态
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 327680000    # 328M步 (5000 iterations, 1024×64)
log_interval: 20
eval_interval: 100
save_interval: 50

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256]  # 增大网络容量处理复杂奖励
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 100
video_frames: 180
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 1
  stage_name: "stepping"
  min_iterations: 5000     # 328M步/(1024*64) = 5000 iterations (3天训练方案)
  transition_criteria:
    min_gait_symmetry: 0.5    # 步态对称性奖励 > 0.5
    min_foot_clearance: 0.3   # 脚部抬高奖励 > 0.3
    min_height_stability: 0.9  # 高度稳定性 > 90%
