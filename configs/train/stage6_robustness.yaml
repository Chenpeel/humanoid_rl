# ==================== 阶段6：鲁棒性提升 ====================
# 目标：全面提升性能和鲁棒性
# 训练步数：5.2B-10.5B (5000-10000 iterations)
# 最终目标：在各种条件下稳定运行

# ==================== 场景配置 ====================
scene: jiyuan_fit_rough  # 粗糙地形
env_type: walking

# ==================== 环境配置 ====================
num_envs: 2048
num_steps: 32
max_episode_steps: 2000

# ==================== 任务参数（课程学习） ====================
# 速度命令范围：完整速度范围
cmd_x_range: [-0.5, 1.2]
cmd_y_range: [-0.5, 0.5]
cmd_yaw_range: [-1.0, 1.0]

# ==================== 奖励权重（鲁棒性优化） ====================
# 基础奖励权重（鲁棒性综合平衡）
reward_weights:
  # 基础运动奖励（鲁棒性平衡配置）
  forward_velocity: 1.5       # 保持前向速度奖励
  gait_symmetry: 0.5          # 增加步态对称性奖励（鲁棒性需要对称）
  foot_clearance: 0.4         # 增加脚部抬高奖励（提高越障能力）
  trunk_height: 0.8           # 降低高度保持奖励
  orientation: -0.4           # 降低姿态惩罚强度
  trunk_lin_vel_z: -0.4       # 降低Z方向速度惩罚
  drag: -1.0                  # 保持拖地惩罚
  alive: 0.3                  # 保持存活奖励
  action_rate: -0.01          # 保持动作变化率惩罚
  torques: -0.0001            # 保持力矩惩罚

  # Unitree增强奖励项（平衡所有奖励项，追求综合性能）
  gait_periodicity: 1.0       # 步态周期性（平衡，保持节奏）
  swing_trajectory: 1.2       # 摆动轨迹（平衡，优化摆动）
  landing_impact: -0.8        # 着地冲击（平衡惩罚，控制着地）
  energy_efficiency: 1.0      # 能量效率（提高，追求高效运动）
  velocity_tracking: 1.5      # 增强速度跟踪（保持跟踪能力）
  stability: 1.8              # 综合稳定性（重点，鲁棒性核心）

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.003           # 降低熵，专注优化
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 655360000   # 625M步 (减半，约625 iterations)
log_interval: 10
eval_interval: 50
save_interval: 100

# ==================== 优化器配置 ====================
learning_rate: 2.0e-4         # 进一步降低学习率
final_lr_fraction: 0.01

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256]
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 100
video_frames: 180
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 6
  stage_name: "robustness"
  min_iterations: 15       # 进一步减小最小迭代次数（快速测试）
  transition_criteria:
    min_velocity_tracking: 0.8  # 速度跟踪准确率 > 80%
    max_fall_rate: 0.1          # 摔倒率 < 10%
    min_episode_length: 800    # 平均episode长度 > 800步
