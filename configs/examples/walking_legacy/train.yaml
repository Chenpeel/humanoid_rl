# ==================== 行走训练配置文件 (Legacy) ====================
# 对应之前的 train_walking_legacy.yaml

# ==================== 场景配置 ====================
scene: flat_terrain
env_type: walking

# ==================== 环境配置 ====================
num_envs: 4096 # 并行环境数
num_steps: 64
max_episode_steps: 2000

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# ==================== 课程学习配置 ====================
# 指向同目录下的 curriculum.yaml
curriculum_file: configs/examples/walking_legacy/curriculum.yaml

# ==================== 训练配置 ====================
total_timesteps: 10000000000
log_interval: 10
eval_interval: 25
save_interval: 1000

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [256, 256, 128]
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 1000
video_frames: 180
video_camera: "track"
