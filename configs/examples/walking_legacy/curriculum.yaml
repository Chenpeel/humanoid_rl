# ==================== Jiyuan 行走任务标准课程 ====================
# 三阶段渐进式训练配置

stages:
  # ==================== 阶段 1: 站立平衡 (0 - 50k) ====================
  - name: "站立平衡"
    start_step: 0
    end_step: 50000
    description: "学习保持直立姿态、抵抗扰动、建立基本平衡控制能力"

    # 环境参数：严格限制移动，高姿态要求
    env_config:
      cmd_x_range: [0.0, 0.0]
      cmd_y_range: [0.0, 0.0]
      cmd_yaw_range: [0.0, 0.0]
      target_height: 0.78

    # 奖励权重：存活 > 姿态 > 能量
    reward_weights:
      termination: -200.0
      alive: 5.0
      upright_bonus: 2.0
      trunk_height: 2.0
      orientation: -1.5
      trunk_lin_vel_z: -1.0
      action_rate: -0.02
      torques: -0.0002
      joint_limits: -0.2
      # 禁用项
      forward_velocity: 0.0
      gait_symmetry: 0.0
      foot_clearance: 0.0
      drag: 0.0

  # ==================== 阶段 2: 低速行走 (50k - 150k) ====================
  - name: "低速行走"
    start_step: 50000
    end_step: 150000
    description: "学习双脚交替接触、建立基本步态模式、实现低速稳定前进"

    # 环境参数：允许低速移动
    env_config:
      cmd_x_range: [0.1, 0.3]
      cmd_y_range: [-0.1, 0.1]
      cmd_yaw_range: [-0.3, 0.3]
      target_height: 0.78 # 匹配机器人实际站立高度

    # 奖励权重：步态 > 速度 > 稳定
    reward_weights:
      termination: -200.0
      alive: 2.0
      gait_symmetry: 1.5
      foot_clearance: 0.8
      feet_contact_forces: 0.3
      feet_air_time: 0.5
      forward_velocity: 1.0
      upright_bonus: 0.5
      trunk_height: 1.0
      orientation: -0.8
      trunk_lin_vel_z: -0.5
      drag: -0.8
      feet_slide: -0.8
      action_rate: -0.01
      torques: -0.0001
      joint_symmetry: 0.2
      stumbling: -0.5

  # ==================== 阶段 3: 全速行走 (150k+) ====================
  - name: "全速行走"
    start_step: 150000
    end_step: "inf"
    description: "跟踪任意速度命令、优化步态质量和能量效率、提高鲁棒性"

    # 环境参数：全速度范围
    env_config:
      cmd_x_range: [-0.2, 0.8]
      cmd_y_range: [-0.3, 0.3]
      cmd_yaw_range: [-1.0, 1.0]
      target_height: 0.78

    # 奖励权重：性能 > 质量 > 效率
    reward_weights:
      termination: -200.0
      alive: 0.3
      velocity_tracking: 2.0
      gait_symmetry: 0.3
      foot_clearance: 0.2
      feet_air_time: 0.25
      feet_contact_forces: 0.1
      trunk_height: 0.8
      orientation: -0.5
      upright_bonus: 0.0
      trunk_lin_vel_z: -0.5
      drag: -1.0
      feet_slide: -0.5
      stumbling: -0.8
      action_rate: -0.01
      torques: -0.001
      energy_efficiency: 0.001
      joint_symmetry: 0.15
      joint_limits: -0.1
      landing_impact: 0.2
      stability: 0.1
