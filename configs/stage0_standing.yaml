# ==================== 阶段0：站立平衡 ====================
# 目标：学会保持站立，抵抗扰动
# 训练步数：0-209M (0-200 iterations)
# 切换条件：mean_reward > 0.6 持续50次，摔倒率 < 5%

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking       # 行走任务

# ==================== 环境配置 ====================
num_envs: 2048           # 并行环境数（平衡性能和稳定性）
num_steps: 32           # 每次rollout的步数（减小用于本地测试）
max_episode_steps: 500  # episode最大步数（站立不需要太长）

# ==================== 任务参数（课程学习核心） ====================
# 速度命令范围：纯站立，速度为0
cmd_x_range: [0.0, 0.0]      # 前向速度0
cmd_y_range: [0.0, 0.0]      # 侧向速度0
cmd_yaw_range: [0.0, 0.0]    # 角速度0

# ==================== 奖励权重（站立优化） ====================
reward_weights:
  # 基础站立奖励（基于Unitree研究成果优化）
  height: 1.0                # 高度保持（核心奖励）
  orientation: 0.8            # 姿态稳定（稍降低避免过拟合）
  lin_vel: -0.3              # 线速度惩罚（降低惩罚强度）
  ang_vel: -0.2              # 角速度惩罚（降低惩罚强度）
  alive: 0.5                 # 存活奖励（提高基础奖励）
  action_rate: -0.005        # 动作平滑（大幅降低）
  torques: -0.00005          # 能量效率（大幅降低）
  # 新增奖励项（基于Unitree研究）
  foot_clearance: 0.3        # 脚部抬高（小幅抬脚奖励）
  swing_time: 0.2            # 摆动时间（微小摆动奖励）
  contact_force: 0.1         # 接触力控制（减少冲击）
  stability: 0.6             # 综合稳定性（重要奖励）

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01           # 保持较高熵以探索
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 26214400    # 25M步 (约25 iterations，快速测试用)
log_interval: 10
eval_interval: 25
save_interval: 25

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256]  # 增大网络容量以处理更复杂的奖励
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 25
video_frames: 180
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 0
  stage_name: "standing"
  min_iterations: 15       # 进一步减小最小迭代次数（快速测试）
  transition_criteria:
    min_reward: 0.6          # 平均奖励 > 0.6
    max_fall_rate: 0.05      # 摔倒率 < 5%
    min_height_stability: 0.95  # 高度稳定性 > 95%
