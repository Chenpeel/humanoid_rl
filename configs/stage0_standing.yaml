# ==================== 阶段0：站立平衡 ====================
# 目标：学会保持站立，抵抗扰动
# 训练步数：0-15M (0-15 iterations)
# 切换条件：mean_reward > 0.6 持续50次，摔倒率 < 5%

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking       # 行走任务

# ==================== 环境配置 ====================
num_envs: 1024           # 并行环境数（1080Ti 11GB限制，从2048减半）
num_steps: 64           # 每次rollout的步数（翻倍增加时序信息）
max_episode_steps: 500  # episode最大步数（站立不需要太长）

# ==================== 任务参数（课程学习核心） ====================
# 速度命令范围：纯站立，速度为0
cmd_x_range: [0.0, 0.0]      # 前向速度0
cmd_y_range: [0.0, 0.0]      # 侧向速度0
cmd_yaw_range: [0.0, 0.0]    # 角速度0

# ==================== 奖励权重（站立优化） ====================
# 注意：使用行走奖励的键名，但设置forward_velocity为0以实现站立行为
reward_weights:
  # 主要目标：前向运动（站立时设为0）
  forward_velocity: 0.0      # 前向速度奖励（设为0，因为目标是站立）
  # 步态质量（站立时不重要）
  gait_symmetry: 0.0         # 步态对称性（站立时不需要）
  foot_clearance: 0.0        # 脚部抬高（站立时不需要）
  # 躯干稳定（核心奖励）
  trunk_height: 1.2          # 高度保持（核心奖励，提高权重）
  orientation: -0.8          # 姿态惩罚（保持直立）
  trunk_lin_vel_z: -0.5      # Z方向速度惩罚（避免跳动）
  drag: -0.2                 # 拖地惩罚（站立时降低）
  # 能量效率
  action_rate: -0.005        # 动作平滑
  torques: -0.00005          # 扭矩惩罚
  # 存活
  alive: 0.8                 # 存活奖励（提高基础奖励）

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01           # 保持较高熵以探索
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 163840000    # 164M步 (2500 iterations, 1024×64)
log_interval: 20              # 降低日志频率提升性能
eval_interval: 100
save_interval: 50

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256]  # 增大网络容量以处理更复杂的奖励
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 100           # 降低录制频率,减少性能影响
video_frames: 180
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 0
  stage_name: "standing"
  min_iterations: 2500     # 164M步/(1024*64) = 2500 iterations (3天训练方案)
  transition_criteria:
    min_reward: 0.6          # 平均奖励 > 0.6
    max_fall_rate: 0.05      # 摔倒率 < 5%
    min_height_stability: 0.95  # 高度稳定性 > 95%
