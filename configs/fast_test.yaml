# ==================== GTX 1080ti 优化配置 ====================
# 专为 GTX 1080ti 11GB GPU 优化
# 降低内存使用，避免段错误
#
# ==================== Scene Configuration ====================
scene: jiyuan_fit_flat
env_type: walking

# ==================== Environment Configuration ====================
# 降低并行环境数以减少内存使用
num_envs: 512
num_steps: 8
max_episode_steps: 2000

# Batch size = 512 x 64 = 32,768 (减半)
# Memory usage: ~4-6GB (安全用于 GTX 1080ti 11GB)

# ==================== PPO Hyperparameters ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# ==================== Training Configuration ====================
# 保持相同的训练步数，但用更小的batch
# 训练时间会增加，但内存使用降低
total_timesteps: 262144 # iterations x 512 envs x 64 steps
log_interval: 2
eval_interval: 10
save_interval: 20

# ==================== Optimizer Configuration ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== Network Configuration ====================
# 保持较小的网络结构
hidden_dims: [256, 256, 128]
shared_backbone: true

# ==================== Video Recording Configuration ====================
# 禁用视频录制以减少内存压力
enable_video: false
video_interval: 10
video_frames: 180
video_camera: "track"

# ==================== Walking Task Reward Weights ====================
reward_weights:
    # 1. Main objective: forward movement
    forward_velocity: 1.5

    # 2-3. Gait quality
    gait_symmetry: 0.3
    foot_clearance: 0.2

    # 4-7. Trunk stability
    trunk_height: 0.5
    orientation: -0.3
    trunk_lin_vel_z: -0.5
    drag: -1.0

    # 8-9. Energy efficiency
    action_rate: -0.01
    torques: -0.0001

    # 10. Survival
    alive: 0.3
