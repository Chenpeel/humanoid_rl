# ==================== Fast Test Configuration ====================
# Optimized for GTX 1080ti 11GB GPU
# Goal: Quickly test all walking rewards within ~5-10 minutes
#
# ==================== Scene Configuration ====================
scene: flat_terrain
env_type: walking

# ==================== Environment Configuration ====================
num_envs: 4096
num_steps: 64
max_episode_steps: 2000

# Batch size = 4096 x 64 = 262,144
# Memory usage: ~8-10GB (safe for GTX 1080ti 11GB)
# Compilation time: ~10-20 minutes first time (faster than 4090 config)

# ==================== PPO Hyperparameters ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5

# ==================== Training Configuration ====================
# Quick test: only 10 iterations, ~5-10 minutes
total_timesteps: 2621440 # 10 iterations x 4096 envs x 64 steps
log_interval: 2 # More frequent logging
eval_interval: 5
save_interval: 10

# ==================== Optimizer Configuration ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== Network Configuration ====================
# Smaller network for faster compilation and training
hidden_dims: [256, 256, 128]
shared_backbone: true

# ==================== Video Recording Configuration ====================
# Enable video recording for quick visual verification
enable_video: true
video_interval: 5 # Record every 5 updates
video_frames: 180 # 3 seconds @ 60fps
video_camera: "track"

# ==================== Walking Task Reward Weights ====================
# Complete test of all 10 walking rewards
# Reference: src/rl/rewards/walking_rewards.py:481-497
reward_weights:
    # 1. Main objective: forward movement
    forward_velocity: 1.5

    # 2-3. Gait quality
    gait_symmetry: 0.3
    foot_clearance: 0.2

    # 4-7. Trunk stability
    trunk_height: 0.5
    orientation: -0.3
    trunk_lin_vel_z: -0.5
    drag: -1.0

    # 8-9. Energy efficiency
    action_rate: -0.01
    torques: -0.0001

    # 10. Survival
    alive: 0.3
