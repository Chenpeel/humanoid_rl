# 手柄控制环境配置
# TensorFlow重写Open_Duck_Playground项目

# 环境配置
env:
    name: "JoystickEnv"
    model_path: "assets/xmls/mirrored.xml" # MuJoCo模型文件路径
    max_steps: 1000
    dt: 0.02 # 时间步长 (50Hz)
    control_mode: "torque" # 控制模式: torque, position, velocity
    use_gravity: true
    enable_contact: true

    # 观察空间配置
    observation:
        include_qpos: true # 关节位置
        include_qvel: true # 关节速度
        include_imu: true # IMU数据
        include_contact: true # 接触传感器
        include_time: true # 时间信息
        include_target: true # 目标速度

    # 动作空间配置
    action:
        low: -1.0
        high: 1.0
        scale: 1.0 # 动作缩放因子

    # 奖励配置
    reward:
        weights:
            velocity_tracking: 1.0 # 速度跟踪奖励
            action_smoothness: 0.1 # 动作平滑惩罚
            energy_efficiency: 0.01 # 能量效率惩罚
            posture_stability: 0.5 # 姿态稳定奖励

        # 速度跟踪配置
        velocity_tracking:
            target_speed: 1.0 # 目标速度 (m/s)
            direction: "forward" # 方向: forward, backward, left, right
            tolerance: 0.1 # 速度容差

        # 动作平滑配置
        action_smoothness:
            penalty_weight: 0.1

        # 能量效率配置
        energy_efficiency:
            penalty_weight: 0.01

        # 姿态稳定配置
        posture_stability:
            target_height: 0.3 # 目标高度 (m)
            target_pitch: 0.0 # 目标俯仰角 (rad)
            target_roll: 0.0 # 目标横滚角 (rad)
            tolerance: 0.05 # 姿态容差

# 模型配置
model:
    # 策略网络配置
    policy:
        hidden_sizes: [256, 256, 128] # 隐藏层大小
        activation: "relu" # 激活函数: relu, tanh, elu
        output_activation: "tanh" # 输出层激活函数
        use_batch_norm: false # 是否使用批归一化
        use_dropout: false # 是否使用dropout
        dropout_rate: 0.1 # dropout率

    # 价值网络配置
    value:
        hidden_sizes: [256, 256, 128] # 隐藏层大小
        activation: "relu" # 激活函数
        use_batch_norm: false
        use_dropout: false

    # 共享网络配置
    shared:
        use_shared_backbone: true # 是否使用共享主干网络
        shared_hidden_sizes: [256, 256] # 共享层大小

# PPO算法配置
algorithm:
    name: "PPO"

    # 超参数
    hyperparameters:
        learning_rate: 3e-4 # 学习率
        clip_ratio: 0.2 # PPO裁剪比例
        gamma: 0.99 # 折扣因子
        lam: 0.95 # GAE lambda参数
        entropy_coef: 0.01 # 熵系数
        value_coef: 0.5 # 价值损失系数

    # 训练配置
    training:
        num_epochs: 20 # 每个批次的训练轮数 - 增加以提高GPU利用率
        batch_size: 512 # 批次大小 - 增大以充分利用GPU
        minibatch_size: 128 # 小批次大小
        horizon: 2048 # 每个环境的时间步数

        # 优化器配置
        name: "Adam" # 优化器: Adam, RMSprop, SGD
    optimizer:
        beta1: 0.9 # Adam beta1
        beta2: 0.999 # Adam beta2
        epsilon: 1e-7 # Adam epsilon
        weight_decay: 0.0 # 权重衰减

# 训练配置
training:
    total_timesteps: 1000000000 # 总训练步数
    num_envs: 128 # 并行环境数量
    save_freq: 10000 # 保存频率 (步数)
    eval_freq: 5000 # 评估频率 (步数)
    log_freq: 10 # 日志频率 (步数) - 更频繁地更新模型以提高GPU利用率

    # 可视化配置 (可选)
    visualization:
        enable_render: true # 是否启用3D可视化
        render_freq: 10 # 每N个epoch渲染一次
        render_interval: 10 # 每N步渲染一帧 (控制渲染采样率)
        record_video: false # 是否录制视频
        video_dir: "videos" # 视频保存目录
        video_fps: 30 # 视频帧率

    # 检查点配置
    checkpoint:
        save_dir: "./checkpoints/joystick"
        keep_last: 5 # 保留最近的检查点数量
        save_best: true # 是否保存最佳模型

    # 早停配置
    early_stopping:
        enabled: true
        patience: 10 # 耐心值 (评估次数)
        min_delta: 0.01 # 最小改进量

    # 学习率调度
    lr_scheduler:
        enabled: true
        scheduler_type: "linear" # 调度器类型: linear, cosine, exponential
        start_lr: 3e-4
        end_lr: 1e-6
        warmup_steps: 10000 # 预热步数

# 评估配置
evaluation:
    num_episodes: 10 # 评估回合数
    render: false # 是否渲染
    save_video: false # 是否保存视频
    video_fps: 30 # 视频帧率

    # 评估指标
    metrics:
        - "episode_return" # 回合回报
        - "episode_length" # 回合长度
        - "average_speed" # 平均速度
        - "success_rate" # 成功率
        - "energy_consumption" # 能量消耗

# 日志配置
logging:
    log_dir: "./logs/joystick"
    use_tensorboard: true
    use_wandb: false # 是否使用Weights & Biases

    # TensorBoard配置
    tensorboard:
        update_freq: 100 # 更新频率 (步数)

    # 控制台日志
    console:
        level: "INFO" # 日志级别: DEBUG, INFO, WARNING, ERROR
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# 硬件配置
hardware:
    device: "auto" # 设备: auto, cpu, gpu
    num_threads: 4 # CPU线程数
    gpu_memory_fraction: 0.8 # GPU内存使用比例

    # 性能优化
    performance:
        use_xla: true # 是否使用XLA加速
        use_mixed_precision: false # 是否使用混合精度
        tf_function: true # 是否使用tf.function

# 随机种子
seed: 42

# 调试配置
debug:
    verbose: false
    print_obs: false # 打印观察值
    print_reward: false # 打印奖励
    print_action: false # 打印动作
    save_trajectories: false # 保存轨迹数据
