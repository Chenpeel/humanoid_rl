# ==================== 阶段4：高速适应 ====================
# 目标：高速行走，扩展速度范围
# 训练步数：2.1B-3.1B (2000-3000 iterations)
# 切换条件：能够跟踪1.0 m/s速度命令

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking

# ==================== 环境配置 ====================
num_envs: 2048
num_steps: 32
max_episode_steps: 2000

# ==================== 任务参数（课程学习） ====================
# 速度命令范围：扩大速度范围
cmd_x_range: [-0.5, 1.2]      # 扩大速度范围
cmd_y_range: [-0.5, 0.5]      # 扩大侧向范围
cmd_yaw_range: [-1.0, 1.0]    # 扩大转动范围

# ==================== 奖励权重（高速适应优化） ====================
reward_weights:
  forward_velocity: 2.0       # 加强速度奖励（重点）
  gait_symmetry: 0.3
  foot_clearance: 0.2
  trunk_height: 1.0          # 高度保持奖励（降低避免过拟合）
  orientation: -0.5          # 姿态惩罚（降低避免负奖励爆炸）
  trunk_lin_vel_z: -0.5      # Z方向速度惩罚（降低）
  drag: -1.0
  alive: 0.3
  action_rate: -0.01
  torques: -0.0001

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.005
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 131072000   # 125M步 (减半，约125 iterations)
log_interval: 10
eval_interval: 25
save_interval: 50

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [256, 256, 128]
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 50
video_frames: 180
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 4
  stage_name: "fast_walk"
  min_iterations: 15       # 进一步减小最小迭代次数（快速测试）
  transition_criteria:
    min_velocity_tracking: 0.75  # 速度跟踪准确率 > 75%
    min_max_velocity: 0.9        # 最大稳定速度 > 0.9 m/s
    max_fall_rate: 0.12          # 摔倒率 < 12%
