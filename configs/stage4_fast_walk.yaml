# ==================== 阶段4：高速适应 ====================
# 目标：高速行走，扩展速度范围
# 训练步数：165M-215M (165-215 iterations)
# 切换条件：能够跟踪1.0 m/s速度命令

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking

# ==================== 环境配置 ====================
num_envs: 1024           # 1080Ti 11GB限制，从2048减半
num_steps: 64           # 翻倍增加时序信息
max_episode_steps: 2000

# ==================== 任务参数（课程学习） ====================
# 速度命令范围：扩大速度范围
cmd_x_range: [-0.5, 1.2]      # 扩大速度范围
cmd_y_range: [-0.5, 0.5]      # 扩大侧向范围
cmd_yaw_range: [-1.0, 1.0]    # 扩大转动范围

# ==================== 奖励权重（高速适应优化） ====================
# 基础奖励权重（高速优化调整）
reward_weights:
  # 基础运动奖励（针对高速调整）
  forward_velocity: 1.8       # 保持较高的前向速度奖励
  gait_symmetry: 0.4          # 保持步态对称性奖励
  foot_clearance: 0.4         # 增加脚部抬高奖励（高速需要更大摆动）
  trunk_height: 0.8           # 降低高度保持奖励
  orientation: -0.4           # 降低姿态惩罚强度
  trunk_lin_vel_z: -0.4       # 降低Z方向速度惩罚
  drag: -0.8                  # 保持拖地惩罚（高速更关键）
  alive: 0.3                  # 保持存活奖励
  action_rate: -0.01          # 保持动作变化率惩罚
  torques: -0.0001            # 保持力矩惩罚

  # 增强奖励项（需要环境额外支持）
  # gait_periodicity: 1.0       # 步态周期性（需要phase）
  # swing_trajectory: 1.5       # 摆动轨迹（需要phase）
  # landing_impact: -1.0        # 着地冲击（需要landing_events）
  # energy_efficiency: 0.5      # 能量效率（需要joint_velocities）
  # velocity_tracking: 2.5      # 增强速度跟踪（需要command和actual_velocity）
  stability: 1.5              # 综合稳定性

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.005
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 819200000    # 819M步 (12500 iterations, 1024×64)
log_interval: 20
eval_interval: 100
save_interval: 50

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256]
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 100
video_frames: 180
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 4
  stage_name: "fast_walk"
  min_iterations: 12500    # 819M步/(1024*64) = 12500 iterations (3天训练方案)
  transition_criteria:
    min_velocity_tracking: 0.75  # 速度跟踪准确率 > 75%
    min_max_velocity: 0.9        # 最大稳定速度 > 0.9 m/s
    max_fall_rate: 0.12          # 摔倒率 < 12%
