# ==================== 阶段4：高速适应 ====================
# 目标：高速行走，扩展速度范围
# 训练步数：2.1B-3.1B (2000-3000 iterations)
# 切换条件：能够跟踪1.0 m/s速度命令

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking

# ==================== 环境配置 ====================
num_envs: 2048
num_steps: 32
max_episode_steps: 2000

# ==================== 任务参数（课程学习） ====================
# 速度命令范围：扩大速度范围
cmd_x_range: [-0.5, 1.2]      # 扩大速度范围
cmd_y_range: [-0.5, 0.5]      # 扩大侧向范围
cmd_yaw_range: [-1.0, 1.0]    # 扩大转动范围

# ==================== 奖励权重（高速适应优化） ====================
# 基础奖励权重（高速优化调整）
reward_weights:
  # 基础运动奖励（针对高速调整）
  forward_velocity: 1.8       # 保持较高的前向速度奖励
  gait_symmetry: 0.4          # 保持步态对称性奖励
  foot_clearance: 0.4         # 增加脚部抬高奖励（高速需要更大摆动）
  trunk_height: 0.8           # 降低高度保持奖励
  orientation: -0.4           # 降低姿态惩罚强度
  trunk_lin_vel_z: -0.4       # 降低Z方向速度惩罚
  drag: -0.8                  # 保持拖地惩罚（高速更关键）
  alive: 0.3                  # 保持存活奖励
  action_rate: -0.01          # 保持动作变化率惩罚
  torques: -0.0001            # 保持力矩惩罚

  # Unitree增强奖励项（重点强化速度跟踪和摆动轨迹）
  gait_periodicity: 1.0       # 步态周期性（高速下保持节奏）
  swing_trajectory: 1.5       # 摆动轨迹（重点，高速需要优化摆动路径）
  landing_impact: -1.0        # 着地冲击（强化惩罚，高速着地更危险）
  energy_efficiency: 0.5      # 能量效率（适度要求）
  velocity_tracking: 2.5      # 增强速度跟踪（重点，高速跟踪更困难）
  stability: 1.5              # 综合稳定性（重点，高速需要更强稳定性）

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.005
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 131072000   # 125M步 (减半，约125 iterations)
log_interval: 10
eval_interval: 25
save_interval: 50

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256]
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 50
video_frames: 180
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 4
  stage_name: "fast_walk"
  min_iterations: 15       # 进一步减小最小迭代次数（快速测试）
  transition_criteria:
    min_velocity_tracking: 0.75  # 速度跟踪准确率 > 75%
    min_max_velocity: 0.9        # 最大稳定速度 > 0.9 m/s
    max_fall_rate: 0.12          # 摔倒率 < 12%
