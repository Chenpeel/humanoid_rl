# ==================== 站立平衡专训课程（单阶段）====================
# 目标：只训练站立（命令全 0），用于打好平衡基础。
# 备注：用 walking env + walking rewards，确保后续切到走路课程学习时 obs/act 维度不变。

stages:
  - name: "站立平衡"
    start_step: 0
    end_step: "inf"
    description: "站立平衡专训（命令锁死为0），训练到至少20M env steps后再接走路课程"

    env_config:
      cmd_x_range: [0.0, 0.0]
      cmd_y_range: [0.0, 0.0]
      cmd_yaw_range: [0.0, 0.0]
      target_height: 0.90
      height_threshold: 0.70
      upright_threshold: 0.85
      max_steps: 500

    reward_weights:
      # 终止惩罚（WalkingEnv 会在 done 时应用）
      termination: -200.0

      # 核心：存活 + 姿态 + 高度
      alive: 5.0
      upright_bonus: 2.0
      trunk_height: 1.5
      orientation: -1.5
      knee_bend: 0.5
      double_support: 0.5
      toe_only: -0.5

      # 抑制漂移/抖动（站立阶段很关键）
      lin_vel: -1.0
      ang_vel: -0.5
      trunk_lin_vel_z: -1.0
      stability: 0.5

      # 正则化
      action_rate: -0.02
      torques: -0.0002
      joint_limits: -0.2
      hip_deviation: -0.02
      joint_deviation: -0.005
      joint_symmetry: 0.2
      feet_slide: -0.2

      # 禁用走路相关项（保留key以稳定pytree结构）
      forward_velocity: 0.0
      gait_symmetry: 0.0
      foot_clearance: 0.0
      feet_air_time: 0.0
      feet_contact_forces: 0.0
      stumbling: 0.0
      drag: 0.0
      energy_efficiency: 0.0
      landing_impact: 0.0
      velocity_tracking: 0.0
