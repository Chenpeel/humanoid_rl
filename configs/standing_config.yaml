# 站立保持环境配置
# TensorFlow重写Open_Duck_Playground项目

# 环境配置
env:
    name: "StandingEnv"
    model_path: "assets/xmls/mirrored.xml" # MuJoCo模型文件路径
    max_steps: 2000
    dt: 0.02 # 时间步长 (50Hz)
    control_mode: "torque" # 控制模式: torque, position, velocity
    use_gravity: true
    enable_contact: true

    # 观察空间配置
    observation:
        include_qpos: true # 关节位置
        include_qvel: true # 关节速度
        include_imu: true # IMU数据
        include_contact: true # 接触传感器
        include_time: true # 时间信息
        include_com: true # 质心位置
        include_cop: true # 压力中心

    # 动作空间配置
    action:
        low: -1.0
        high: 1.0
        scale: 0.8 # 动作缩放因子，站立需要更精细的控制

    # 扰动配置
    disturbance:
        enabled: true
        types: ["push", "tilt"] # 扰动类型: push(推力), tilt(倾斜)

        # 推力扰动
        push:
            probability: 0.1 # 每个时间步施加扰动的概率
            magnitude_range: [0.0, 50.0] # 推力大小范围 (N)
            duration_range: [0.1, 0.5] # 扰动持续时间范围 (s)
            direction: "random" # 方向: random, forward, backward, left, right

        # 倾斜扰动
        tilt:
            probability: 0.05
            angle_range: [0.0, 0.2] # 倾斜角度范围 (rad)
            duration_range: [0.2, 1.0]

    # 奖励配置
    reward:
        weights:
            posture_stability: 1.0 # 姿态稳定奖励
            com_stability: 0.8 # 质心稳定奖励
            energy_efficiency: 0.05 # 能量效率惩罚
            action_smoothness: 0.1 # 动作平滑惩罚
            fall_penalty: 5.0 # 摔倒惩罚

        # 姿态稳定配置
        posture_stability:
            target_height: 0.3 # 目标高度 (m)
            target_pitch: 0.0 # 目标俯仰角 (rad)
            target_roll: 0.0 # 目标横滚角 (rad)
            tolerance: 0.02 # 姿态容差，站立需要更高精度
            height_weight: 0.4 # 高度权重
            pitch_weight: 0.3 # 俯仰权重
            roll_weight: 0.3 # 横滚权重

        # 质心稳定配置
        com_stability:
            target_com: [0.0, 0.0, 0.15] # 目标质心位置 (x, y, z)
            tolerance: 0.05 # 质心位置容差
            velocity_weight: 0.3 # 质心速度权重

        # 能量效率配置
        energy_efficiency:
            penalty_weight: 0.05
            torque_weight: 0.7 # 扭矩权重
            velocity_weight: 0.3 # 速度权重

        # 动作平滑配置
        action_smoothness:
            penalty_weight: 0.1

        # 摔倒检测
        fall_detection:
            height_threshold: 0.15 # 高度阈值，低于此值视为摔倒 (m)
            pitch_threshold: 0.5 # 俯仰角阈值 (rad)
            roll_threshold: 0.5 # 横滚角阈值 (rad)
            terminate_on_fall: true # 摔倒时终止回合

# 模型配置
model:
    # 策略网络配置
    policy:
        hidden_sizes: [256, 256, 128] # 隐藏层大小
        activation: "tanh" # 使用tanh以获得更平滑的输出
        output_activation: "tanh"
        use_batch_norm: true # 站立任务需要更稳定的训练
        use_dropout: false
        dropout_rate: 0.1

    # 价值网络配置
    value:
        hidden_sizes: [256, 256, 128]
        activation: "relu"
        use_batch_norm: true
        use_dropout: false

    # 共享网络配置
    shared:
        use_shared_backbone: true
        shared_hidden_sizes: [256, 256]

# PPO算法配置
algorithm:
    name: "PPO"

    # 超参数
    hyperparameters:
        learning_rate: 1e-4 # 较低的学习率以获得更稳定的训练
        clip_ratio: 0.1 # 较小的裁剪比例
        gamma: 0.995 # 较高的折扣因子
        lam: 0.97
        entropy_coef: 0.005 # 较低的熵系数
        value_coef: 0.5

    # 训练配置
    training:
        num_epochs: 15 # 更多的训练轮数
        batch_size: 128 # 较大的批次大小
        minibatch_size: 64
        horizon: 4096 # 较长的时间步数

    # 优化器配置
    optimizer:
        name: "Adam"
        beta1: 0.9
        beta2: 0.999
        epsilon: 1e-7
        weight_decay: 1e-4 # 添加权重衰减以防止过拟合

# 训练配置
training:
    total_timesteps: 2000000 # 更多的训练步数
    num_envs: 16 # 更多的并行环境
    save_freq: 20000
    eval_freq: 10000
    log_freq: 100

    # 检查点配置
    checkpoint:
        save_dir: "./checkpoints/standing"
        keep_last: 10
        save_best: true

    # 早停配置
    early_stopping:
        enabled: true
        patience: 20 # 更大的耐心值
        min_delta: 0.005 # 更小的改进量要求

    # 学习率调度
    lr_scheduler:
        enabled: true
        scheduler_type: "cosine" # 使用cosine调度器
        start_lr: 1e-4
        end_lr: 1e-6
        warmup_steps: 20000

    # 课程学习配置
    curriculum:
        enabled: true
        stages:
            - name: "stage1"
              disturbance_enabled: false
              max_steps: 1000
              target_stability: 0.8

            - name: "stage2"
              disturbance_enabled: true
              disturbance_probability: 0.05
              max_steps: 1500
              target_stability: 0.7

            - name: "stage3"
              disturbance_enabled: true
              disturbance_probability: 0.1
              max_steps: 2000
              target_stability: 0.6

# 评估配置
evaluation:
    num_episodes: 20 # 更多的评估回合
    render: false
    save_video: true # 保存站立视频
    video_fps: 30

    # 评估指标
    metrics:
        - "episode_return"
        - "episode_length"
        - "stability_score" # 稳定性评分
        - "fall_rate" # 摔倒率
        - "energy_efficiency" # 能量效率
        - "disturbance_recovery_time" # 扰动恢复时间

    # 扰动测试
    disturbance_test:
        enabled: true
        test_cases:
            - type: "push"
              magnitude: 30.0
              direction: "forward"

            - type: "push"
              magnitude: 30.0
              direction: "backward"

            - type: "push"
              magnitude: 20.0
              direction: "left"

            - type: "push"
              magnitude: 20.0
              direction: "right"

            - type: "tilt"
              angle: 0.15
              axis: "pitch"

            - type: "tilt"
              angle: 0.15
              axis: "roll"

# 日志配置
logging:
    log_dir: "./logs/standing"
    use_tensorboard: true
    use_wandb: false

    # TensorBoard配置
    tensorboard:
        update_freq: 100

    # 控制台日志
    console:
        level: "INFO"
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

    # 详细日志
    detailed_logs:
        log_observations: false
        log_actions: false
        log_rewards: true
        log_disturbances: true

# 硬件配置
hardware:
    device: "auto"
    num_threads: 8 # 更多的CPU线程
    gpu_memory_fraction: 0.9

    # 性能优化
    performance:
        use_xla: true
        use_mixed_precision: false
        tf_function: true

# 随机种子
seed: 42

# 可视化配置
visualization:
    enable_render: false # 是否启用3D渲染
    render_freq: 10 # 每N个epoch渲染一次
    render_interval: 10 # 每N步渲染一帧（帧采样）
    record_video: false # 是否录制视频
    video_dir: "videos" # 视频保存目录
    video_fps: 30 # 视频帧率

# 调试配置
debug:
    verbose: false
    print_obs: false
    print_reward: false
    print_action: false
    save_trajectories: true # 保存站立轨迹用于分析

    # 可视化调试
    visualization:
        plot_com_trajectory: true # 绘制质心轨迹
        plot_cop_trajectory: true # 绘制压力中心轨迹
        plot_joint_angles: false
        plot_torques: false
