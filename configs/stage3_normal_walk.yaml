# ==================== 阶段3：正常行走 ====================
# 目标：中等速度行走，稳定步态
# 训练步数：1.05B-2.1B (1000-2000 iterations)
# 切换条件：速度跟踪准确率 > 80%

# ==================== 场景配置 ====================
scene: jiyuan_fit_flat  # 平坦地形
env_type: walking

# ==================== 环境配置 ====================
num_envs: 2048
num_steps: 32
max_episode_steps: 2000

# ==================== 任务参数（课程学习） ====================
# 速度命令范围：正常行走
cmd_x_range: [-0.2, 0.8]      # 包含后退和前进
cmd_y_range: [-0.3, 0.3]      # 侧向移动
cmd_yaw_range: [-0.5, 0.5]    # 转动

# ==================== 奖励权重（正常行走优化） ====================
# 基础奖励权重（适度调整）
reward_weights:
  # 基础运动奖励（适度调整）
  forward_velocity: 1.2       # 适度降低前向速度奖励
  gait_symmetry: 0.5          # 保持步态对称性奖励
  foot_clearance: 0.3         # 增加脚部抬高奖励
  trunk_height: 0.8           # 降低高度保持奖励
  orientation: -0.3           # 降低姿态惩罚强度
  trunk_lin_vel_z: -0.3       # 降低Z方向速度惩罚
  drag: -0.6                  # 降低拖地惩罚
  alive: 0.3                  # 保持存活奖励
  action_rate: -0.008         # 降低动作变化率惩罚
  torques: -0.00008           # 降低力矩惩罚

  # Unitree增强奖励项（平衡速度跟踪和步态质量）
  gait_periodicity: 1.2       # 步态周期性（重要，保持节奏稳定）
  swing_trajectory: 1.0       # 摆动轨迹（增强，优化摆动路径）
  landing_impact: -0.7        # 着地冲击（增强惩罚，改善着地质量）
  energy_efficiency: 0.8      # 能量效率（提高效率要求）
  velocity_tracking: 1.8      # 增强速度跟踪（重要，提高跟踪精度）
  stability: 1.2              # 综合稳定性（增强稳定性要求）

# ==================== PPO超参数 ====================
num_epochs: 4
num_minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.005
max_grad_norm: 0.5

# ==================== 训练配置 ====================
total_timesteps: 131072000   # 125M步 (减半，约125 iterations)
log_interval: 10
eval_interval: 25
save_interval: 50

# ==================== 优化器配置 ====================
learning_rate: 3.0e-4
final_lr_fraction: 0.02

# ==================== 网络配置 ====================
hidden_dims: [512, 512, 256]
shared_backbone: true

# ==================== 视频录制配置 ====================
enable_video: true
video_interval: 50
video_frames: 180
video_camera: "track"

# ==================== 阶段切换配置 ====================
stage_config:
  stage_id: 3
  stage_name: "normal_walk"
  min_iterations: 15       # 进一步减小最小迭代次数（快速测试）
  transition_criteria:
    min_velocity_tracking: 0.8  # 速度跟踪准确率 > 80%
    min_episode_length: 1000    # 平均episode长度 > 1000步
    max_fall_rate: 0.08         # 摔倒率 < 8%
